<g fill="none" stroke="#c9aa70" stroke-width="34" stroke-linecap="round" stroke-dasharray="80 22">
 <path d="M1580 1510 Q1500 1250 1560 930 Q1500 680 1350 500"/>
 <path d="M1580 1510 Q1150 1370 850 1450 Q600 1510 420 1600"/>
 <path d="M1580 1510 Q1900 1390 2180 1100 Q2400 900 2700 920"/>
 <path d="M1580 1510 Q1900 1580 2300 1580"/>
</g>
