<g filter="url(#shadow)">
 <rect x="1270" y="420" width="270" height="110" rx="22" fill="#214c62"/><text x="1405" y="490" text-anchor="middle" fill="white" font-size="46" font-family="sans-serif">北境城鎮</text>
 <rect x="2320" y="1270" width="260" height="110" rx="22" fill="#214c62"/><text x="2450" y="1340" text-anchor="middle" fill="white" font-size="44" font-family="sans-serif">海灣小鎮</text>
</g>
<!-- Spawn -->
<g filter="url(#shadow)"><circle cx="1580" cy="1510" r="120" fill="#ffd83d" opacity=".25"/><circle cx="1580" cy="1510" r="70" fill="#e9f6ff" stroke="#1684d8" stroke-width="18"/><path d="M1580 1440 L1640 1500 L1615 1500 L1615 1570 L1545 1570 L1545 1500 L1520 1500Z" fill="#1684d8"/><text x="1580" y="1665" text-anchor="middle" fill="#fff" font-size="48" font-family="sans-serif" font-weight="bold">出生點・新手平原</text></g>
<!-- Monster reserved zones -->
<g fill="none" stroke="#d83434" stroke-width="14" stroke-dasharray="30 18" opacity=".95">
 <circle cx="720" cy="1100" r="210"/><circle cx="1020" cy="1550" r="180"/><circle cx="2180" cy="780" r="210"/><circle cx="2550" cy="1000" r="190"/><circle cx="2200" cy="1450" r="220"/><circle cx="550" cy="620" r="150"/>
</g>
<g fill="#8d2020" font-family="sans-serif" font-size="42" font-weight="bold" text-anchor="middle">
 <text x="720" y="1100">怪物區域 A</text><text x="1020" y="1550">怪物區域 B</text><text x="2180" y="780">怪物區域 C</text><text x="2550" y="1000">怪物區域 D</text><text x="2200" y="1450">怪物區域 E</text><text x="550" y="620">怪物區域 F</text>
</g>
<!-- Dungeon reserved areas -->
<g fill="#4d2a70" opacity=".95"><rect x="850" y="420" width="180" height="130" rx="25"/><rect x="1750" y="1170" width="180" height="130" rx="25"/></g>
