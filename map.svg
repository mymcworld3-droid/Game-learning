<g fill="#285f3b" opacity=".9">
 <circle cx="650" cy="950" r="190"/><circle cx="900" cy="1150" r="230"/><circle cx="700" cy="1400" r="210"/>
 <circle cx="1750" cy="500" r="190"/><circle cx="1500" cy="550" r="150"/><circle cx="2050" cy="900" r="170"/>
</g>
