<path d="M260 520 L520 150 L680 470 L900 100 L1100 520 L900 650 L480 650Z" fill="url(#snow)" stroke="#627d8a" stroke-width="12"/>
<path d="M1900 360 L2150 80 L2310 400 L2470 150 L2680 510 L2500 690 L2050 650Z" fill="#5b4b3e" stroke="#3d302a" stroke-width="14"/>
