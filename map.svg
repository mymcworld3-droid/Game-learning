<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="2200" viewBox="0 0 3200 2200">
<defs>
  <linearGradient id="grass" x2="0" y2="1"><stop stop-color="#6fae55"/><stop offset="1" stop-color="#3f7f43"/></linearGradient>
  <linearGradient id="water" x2="0" y2="1"><stop stop-color="#3d9fc4"/><stop offset="1" stop-color="#17658c"/></linearGradient>
  <linearGradient id="sand" x2="0" y2="1"><stop stop-color="#d8b65d"/><stop offset="1" stop-color="#a9823d"/></linearGradient>
  <linearGradient id="snow" x2="0" y2="1"><stop stop-color="#eaf5f7"/><stop offset="1" stop-color="#8faec0"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".35"/></filter>
</defs>
<rect width="3200" height="2200" fill="url(#water)"/>
<!-- Main continent -->
<path d="M240 520 Q450 220 820 300 Q1100 120 1400 300 Q1720 140 2010 330 Q2320 220 2700 520 Q2950 760 2800 1040 Q3050 1310 2750 1580 Q2500 1800 2150 1690 Q1900 2010 1500 1840 Q1190 2050 900 1840 Q540 1940 360 1630 Q120 1400 300 1110 Q80 850 240 520Z" fill="url(#grass)" stroke="#234c35" stroke-width="28"/>
