 <g fill="#39b96b"><circle cx="1150" cy="900" r="32"/><text x="1150" y="965" fill="#173c27">資源點</text></g>
</g>
<!-- Title / legend -->
<rect x="80" y="80" width="640" height="190" rx="30" fill="#132b2b" opacity=".9"/>
<text x="120" y="155" fill="white" font-size="58" font-family="sans-serif" font-weight="bold">冒險大陸</text>
<text x="120" y="215" fill="#c9e5d0" font-size="34" font-family="sans-serif">開放世界・Lv.1–50+</text>
<g transform="translate(2570 180)"><path d="M0 -100 L25 -20 L100 0 L25 25 L0 100 L-25 25 L-100 0 L-25 -20Z" fill="#f4e5b4" stroke="#3b3226" stroke-width="8"/><text y="155" text-anchor="middle" fill="white" font-size="38" font-family="sans-serif">N</text></g>
<!-- Unexplored island -->
<path d="M2480 1640 Q2700 1540 2910 1680 Q2980 1830 2790 1910 Q2570 1940 2450 1810Z" fill="#53686b" stroke="#314144" stroke-width="18" stroke-dasharray="30 18"/>
<text x="2680" y="1760" text-anchor="middle" fill="white" font-size="38" font-family="sans-serif">未探索區域</text>
