<!-- Resource / quest placeholders -->
<g font-family="sans-serif" font-size="38" text-anchor="middle" font-weight="bold">
 <g fill="#39b96b"><circle cx="1320" cy="1260" r="32"/><text x="1320" y="1325" fill="#173c27">資源點</text></g>
