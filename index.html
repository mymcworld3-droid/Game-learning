<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Learning</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game" id="game">
        <div class="world" id="world">
            <div class="map-layer-stack" aria-label="開放世界分層地圖">
                <img class="world-map map-layer terrain-layer" src="assets/maps/layers/terrain-base.svg" alt="地形">
                <img class="world-map map-layer nature-layer" src="assets/maps/layers/nature.svg" alt="自然與道路">
                <img class="world-map map-layer structures-layer" src="assets/maps/layers/structures.svg" alt="建築與設施">
                <img class="world-map map-layer markers-layer" src="assets/maps/layers/markers.svg" alt="世界標記">
            </div>
            <div class="world-markers" id="worldMarkers"></div>
            <div class="player" id="player" aria-label="玩家"></div>
        </div>

        <section class="hud">
            <div class="zone-info">
                <strong id="zoneName">新手平原</strong>
                <span id="zoneLevel">Lv.1–5</span>
            </div>
            <button class="map-button" id="mapButton" type="button">地圖</button>
        </section>

        <div class="map-panel" id="mapPanel" aria-hidden="true">
            <div class="map-header">
                <strong>冒險大陸</strong>
                <button id="closeMap" type="button">×</button>
            </div>
            <div class="map-frame">
                <div class="map-layer-stack map-ui-stack" aria-label="世界地圖預覽">
                    <img class="map-layer" src="assets/maps/layers/terrain-base.svg" alt="地形">
                    <img class="map-layer" src="assets/maps/layers/nature.svg" alt="自然與道路">
                    <img class="map-layer" src="assets/maps/layers/structures.svg" alt="建築與設施">
                    <img class="map-layer" src="assets/maps/layers/markers.svg" alt="標記">
                </div>
                <div class="map-player-marker" id="mapPlayerMarker"></div>
            </div>
            <div class="map-legend">
                <span>🔵 你的位置</span><span>🔴 怪物區</span><span>🟣 副本</span><span>🟡 任務</span>
            </div>
        </div>
    </main>
    <script src="game.js"></script>
</body>
</html>
